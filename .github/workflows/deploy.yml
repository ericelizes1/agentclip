# Push to main → deploy both Fly apps.
#
# One-time setup: in this repo's GitHub Settings → Secrets → Actions,
# add `FLY_API_TOKEN` from a Fly deploy token (Fly dashboard → Account
# → Access Tokens → Create deploy token, scoped to the org owning the
# apps). The same token works for both apps.
#
# Deploys run in parallel; concurrency keys prevent two simultaneous
# deploys of the same app from racing.

name: deploy

on:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    concurrency: deploy-api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app agentclip-api -c fly.toml
        working-directory: ./api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  web:
    runs-on: ubuntu-latest
    concurrency: deploy-web
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app agentclip-web -c fly.toml
        working-directory: ./web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
