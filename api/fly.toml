# Fly.io app config for the AgentClip API.
#
# Deploy: cd api && fly deploy
# Bootstrap: fly launch --copy-config --no-deploy --name agentclip-api
# Set secrets via 1Password: bin/sync-secrets.sh api
# Logs: fly logs --app agentclip-api
# SSH: fly ssh console --app agentclip-api
#
# Architecture:
# - Single shared-cpu-1x machine (768 MB RAM). 256MB OOM'd on the
#   first real upload (boto3 + multipart pushed gunicorn workers
#   past the limit); 768MB gives headroom for boto3's botocore
#   service definitions plus a multipart buffer. Scale via `fly scale`.
# - Auto-stops on idle to keep $/month near zero; cold start is ~2s
#   for Django + the slim image.
# - Postgres lives on Neon (external; DATABASE_URL secret).
# - Object storage lives on Cloudflare R2 (external; R2_* secrets).

app = 'agentclip-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Two process groups, one container image. ``app`` runs the API
# (gunicorn); ``worker`` runs the Celery worker that consumes the
# ``renders`` queue (MP4/PDF rendering). Each gets its own machine
# pool sized via the [[vm]] entries below.
[processes]
  app = "sh -c 'python manage.py migrate --noinput && gunicorn agentclip_app.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60 --access-logfile - --error-logfile -'"
  worker = "celery -A agentclip_app worker -Q renders -l info --concurrency=1 --max-tasks-per-child=20"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = '15s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/schema/'

[env]
  DJANGO_DEBUG = 'false'
  DJANGO_DB_SSLMODE = 'require'
  DJANGO_SECURE_SSL_REDIRECT = 'true'
  DJANGO_SECURE_HSTS_SECONDS = '31536000'
  DJANGO_ALLOWED_HOSTS = 'agentclip-api.fly.dev,api.agentclip.dev'
  DJANGO_CSRF_TRUSTED_ORIGINS = 'https://api.agentclip.dev,https://agentclip.dev'
  R2_REGION = 'auto'

[[vm]]
  processes = ['app']
  size = 'shared-cpu-1x'
  memory = '768mb'

# Worker machine: ffmpeg + WeasyPrint are memory-hungrier than the API
# during a render. 1GB headroom keeps libx264 from OOMing on a longer
# clip; the machine auto-stops when the queue drains.
[[vm]]
  processes = ['worker']
  size = 'shared-cpu-1x'
  memory = '1gb'

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'
