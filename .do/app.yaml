# DigitalOcean App Platform spec for agentclip-app.
#
# Update `github.repo` to point at your fork or rename, then
# `doctl apps create --spec .do/app.yaml` to deploy.
#
# Postgres + Spaces are managed separately:
# - Postgres: create a managed database in the same region as the app
#   and set DATABASE_URL via the App Platform secrets UI.
# - Spaces: create a Space in the same region, generate a key/secret,
#   and set DO_SPACES_* env vars via the secrets UI.
#
# Everything else is captured below so the spec is reproducible:
# `doctl apps update <id> --spec .do/app.yaml` reapplies changes.

name: agentclip-app
region: nyc

services:
  - name: web
    dockerfile_path: api/Dockerfile
    source_dir: /api
    instance_size_slug: basic-xxs   # ~$5/mo at v1 scale
    instance_count: 1

    github:
      repo: ericelizes/agentclip-app
      branch: main
      deploy_on_push: true

    http_port: 8000

    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    routes:
      - path: /

    envs:
      # --- Public, non-secret defaults ---
      - key: DJANGO_DEBUG
        value: "false"
        scope: RUN_AND_BUILD_TIME
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
        scope: RUN_TIME
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
        scope: RUN_TIME
      - key: DJANGO_DB_SSLMODE
        value: "require"
        scope: RUN_TIME
      - key: DO_SPACES_REGION
        value: "nyc3"
        scope: RUN_AND_BUILD_TIME
      - key: DO_SPACES_ENDPOINT
        value: "https://nyc3.digitaloceanspaces.com"
        scope: RUN_AND_BUILD_TIME

      # --- Secrets: set these in the App Platform UI ---
      # The values below are placeholders to declare the env vars;
      # mark them SECRET via the dashboard so they don't end up in
      # source control or build logs.
      - key: DJANGO_SECRET_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DJANGO_ALLOWED_HOSTS
        scope: RUN_TIME
        value: "agentclip.dev,${APP_DOMAIN}"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        scope: RUN_TIME
        value: "https://agentclip.dev,${APP_URL}"
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: DO_SPACES_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DO_SPACES_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: DO_SPACES_BUCKET
        scope: RUN_TIME

domains:
  # Replace once you have a domain.
  # - domain: agentclip.dev
  #   type: PRIMARY
